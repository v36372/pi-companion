name: companion-local

x-local-logs: &local-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  seaweedfs:
    logging: *local-logs
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command:
      - server
      - -dir=/data
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -filer
      - -s3
      - -s3.config=/etc/seaweedfs/s3.json
      - -volume.max=8
      - -master.volumeSizeLimitMB=256
    working_dir: /data
    restart: unless-stopped
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweed-data:/data
      - ./.local/config/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "printf 'fs.ls /\\n' | weed shell -master=localhost:9333 -filer=localhost:8888 >/dev/null 2>&1 && (wget -S --spider http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/1.1 403')"
      interval: 3s
      timeout: 2s
      retries: 30

  celld:
    logging: *local-logs
    image: debian:trixie-slim
    entrypoint: /usr/local/bin/celld
    restart: unless-stopped
    stop_grace_period: 45s
    env_file: ./.local/config/celld.env
    environment:
      CELLD_BUCKET: s3://companion
      S3_ENDPOINT: http://seaweedfs:8333
      CELLD_ADDR: 0.0.0.0:8080
      CELLD_INTERNAL_ADDR: 0.0.0.0:8081
      CELLD_ADVERTISE: celld:8081
      CELLD_WATCH: /var/lib/celld
      CELLD_DURABILITY: bucket
      CELLD_READY_FLEET_GATE_MS: "0"
      CELLD_IDLE_EVICT_S: "30"
      CELLD_WAKER_TICK_MS: "5000"
      CELLD_MAX_REQUEST_BODY_BYTES: "1048576"
      CELLD_TELEMETRY: "0"
    ports:
      - "127.0.0.1:9876:8080"
      - "127.0.0.1:9877:8081"
    volumes:
      - ./.local/bin/celld:/usr/local/bin/celld:ro
      - celld-cache:/var/lib/celld
    depends_on:
      seaweedfs:
        condition: service_healthy

  fixtures:
    logging: *local-logs
    image: node:24-alpine
    profiles: [test]
    ports:
      - "127.0.0.1:9080:9080"
    command: [node, /app/local-fixtures.mjs]
    volumes:
      - ./scripts/local-fixtures.mjs:/app/local-fixtures.mjs:ro
    depends_on: [celld]

volumes:
  seaweed-data:
  celld-cache:
